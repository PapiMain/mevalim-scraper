name: Run Mevalim Scraper Daily

on:
  schedule:
    # 6:30 AM Israel (Summer) = 3:30 AM UTC
    # We use '33' minutes instead of '00' to avoid the 4:00 AM traffic jam.
    - cron: "33 3 * * *"  
    
    # 1:30 PM Israel (Summer) = 10:30 AM UTC
    - cron: "33 10 * * *" 
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # or your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EMAIL2: ${{ secrets.EMAIL2 }}
          PASSWORD2: ${{ secrets.PASSWORD2 }}
          APPSHEET_APP_ID: ${{ secrets.APPSHEET_APP_ID }}
          APPSHEET_APP_KEY: ${{ secrets.APPSHEET_APP_KEY }}
          # GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scraper.py

  keepalive:
    runs-on: ubuntu-latest
    needs: run-scraper
    if: ${{ github.event_name == 'schedule' }} # only run automatically, not on manual trigger
    permissions:
      contents: write
    steps:
      - name: 🌀 Checkout repo
        uses: actions/checkout@v4

      - name: 💾 Keep workflows alive (once a month)
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit --allow-empty -m "chore: keep workflows alive $(date)"
            git push
          else
            echo "Not the 1st of the month — skipping keepalive commit."
          fi
